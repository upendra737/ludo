  <g transform="translate(146,146)">
    <rect width="220" height="220" rx="44" fill="#ffffff"/>
    <circle cx="62"  cy="62"  r="24" fill="#1e293b"/>
    <circle cx="158" cy="62"  r="24" fill="#1e293b"/>
    <circle cx="62"  cy="158" r="24" fill="#1e293b"/>
    <circle cx="158" cy="158" r="24" fill="#1e293b"/>
    <circle cx="110" cy="110" r="24" fill="#6366f1"/>
  </g>
</svg>
